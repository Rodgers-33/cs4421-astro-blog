name: Deploy SSR Blog to ECS via AWS CDK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fault_injection:
        description: 'Set to true to inject a breaking configuration for SRE testing'
        required: false
        default: 'false'


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: my-astro-blog
          IMAGE_TAG: ${{ github.sha }}
          OPENWEATHER_API_KEY: ${{ github.event.inputs.fault_injection == 'true' && 'FAIL_INJECTION_TRIGGERED' || secrets.OPENWEATHER_API_KEY }}
          HEALTH_CHECK_FAIL: ${{ github.event.inputs.fault_injection == 'true' && 'true' || 'false' }}
        run: |
          docker build \
          --build-arg OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY" \
          --build-arg HEALTH_CHECK_FAIL="$HEALTH_CHECK_FAIL" \
          -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Build Static Website for CDK
        run: npm ci && npm run build

      - name: Install Project & CDK Dependencies
        working-directory: cdk
        run: npm ci

      - name: Deploy Infrastructure & ECS Service with AWS CDK
        working-directory: cdk
        run: npx cdk deploy HelloEcsStack --require-approval never --context imageTag=${{ github.sha }}
        env:
          OPENWEATHER_API_KEY: ${{ github.event.inputs.fault_injection == 'true' && 'FAIL_INJECTION_TRIGGERED' || secrets.OPENWEATHER_API_KEY }}